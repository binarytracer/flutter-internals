name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories surface without a code change.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scan:
    name: Vulnerability scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Scans pubspec.lock against the OSV database; fails on known vulnerabilities.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Blocks PRs that introduce vulnerable dependencies.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
